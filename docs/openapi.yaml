basePath: /
definitions:
  database.DimensionValue:
    properties:
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      dimension_id:
        type: integer
      display_name:
        type: string
      id:
        type: integer
      sort_order:
        type: integer
      updated_at:
        type: string
      value:
        type: string
    type: object
  database.DimensionWithValues:
    properties:
      created_at:
        type: string
      description:
        type: string
      dimension_type:
        description: '''single'' or ''multiple'''
        type: string
      display_name:
        type: string
      id:
        type: integer
      is_required:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
      values:
        items:
          $ref: '#/definitions/database.DimensionValue'
        type: array
    type: object
  database.Document:
    properties:
      author:
        description: note author
        type: string
      created_date:
        description: original creation date from source
        type: string
      document_date:
        description: user-assigned document date (e.g. invoice date)
        type: string
      document_type:
        description: type of document (pdf, txt, etc)
        type: string
      folder:
        type: string
      full_text:
        type: string
      hash:
        type: string
      id:
        type: integer
      ingress_time:
        type: string
      name:
        type: string
      path:
        description: full path to the file
        type: string
      source:
        description: source system (e.g. "evernote")
        type: string
      source_url:
        description: original source URL
        type: string
      ulid:
        description: Have a smaller (than hash) id that can be used in URL's, hopefully
          speed things up
        items:
          type: integer
        type: array
      updated_date:
        description: original modification date from source
        type: string
      url:
        type: string
    type: object
  database.Job:
    properties:
      completedAt:
        type: string
      createdAt:
        type: string
      currentStep:
        description: Human-readable current step
        type: string
      error:
        description: Error message if failed
        type: string
      id:
        items:
          type: integer
        type: array
      message:
        description: Status message
        type: string
      progress:
        description: 0-100
        type: integer
      result:
        description: JSON result data
        type: string
      startedAt:
        type: string
      status:
        $ref: '#/definitions/database.JobStatus'
      totalSteps:
        description: Total number of steps
        type: integer
      type:
        $ref: '#/definitions/database.JobType'
      updatedAt:
        type: string
    type: object
  database.JobStatus:
    enum:
    - pending
    - running
    - completed
    - failed
    - cancelled
    type: string
    x-enum-varnames:
    - JobStatusPending
    - JobStatusRunning
    - JobStatusCompleted
    - JobStatusFailed
    - JobStatusCancelled
  database.JobType:
    enum:
    - ingestion
    - cleanup
    - wordcloud
    - search_reindex
    type: string
    x-enum-varnames:
    - JobTypeIngestion
    - JobTypeCleanup
    - JobTypeWordCloud
    - JobTypeSearchReindex
  database.SavedSearch:
    properties:
      created_at:
        type: string
      description:
        type: string
      icon:
        description: Emoji icon
        type: string
      id:
        type: integer
      is_system:
        description: True for built-in searches
        type: boolean
      name:
        type: string
      query:
        description: 'Unified search query (text #tag ~exclude)'
        type: string
      sort_order:
        description: Display order
        type: integer
      updated_at:
        type: string
    type: object
  database.SavedSearchWithCount:
    properties:
      created_at:
        type: string
      description:
        type: string
      document_count:
        type: integer
      icon:
        description: Emoji icon
        type: string
      id:
        type: integer
      is_system:
        description: True for built-in searches
        type: boolean
      name:
        type: string
      query:
        description: 'Unified search query (text #tag ~exclude)'
        type: string
      sort_order:
        description: Display order
        type: integer
      updated_at:
        type: string
    type: object
  database.Tag:
    properties:
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      sort_order:
        type: integer
      tag_group:
        type: string
      updated_at:
        type: string
    type: object
  engine.DocumentStatus:
    properties:
      documentDate:
        type: string
      documentType:
        type: string
      fileExists:
        type: boolean
      fileSizeBytes:
        type: integer
      hasTags:
        type: boolean
      hasText:
        type: boolean
      hasThumbnail:
        type: boolean
      ingressTime:
        type: string
      name:
        type: string
      path:
        type: string
      tagCount:
        type: integer
      textLength:
        type: integer
      textURL:
        type: string
      thumbnailURL:
        type: string
      ulid:
        type: string
      viewURL:
        type: string
    type: object
  engine.LogEntry:
    properties:
      attrs:
        additionalProperties: true
        type: object
      level:
        type: string
      message:
        type: string
    type: object
  engine.SearchResponse:
    properties:
      documents:
        items:
          $ref: '#/definitions/database.Document'
        type: array
      hasNext:
        type: boolean
      hasPrevious:
        type: boolean
      page:
        type: integer
      pageSize:
        type: integer
      query:
        type: string
      searchName:
        type: string
      totalCount:
        type: integer
      totalPages:
        type: integer
    type: object
  engine.TagWithUsage:
    properties:
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      sort_order:
        type: integer
      tag_group:
        type: string
      updated_at:
        type: string
      usageCount:
        type: integer
    type: object
  engine.fileTreeStruct:
    properties:
      childrenIDs:
        items:
          type: string
        type: array
      fileURL:
        type: string
      fullPath:
        type: string
      id:
        type: string
      isDir:
        type: boolean
      modDate:
        type: string
      name:
        type: string
      openable:
        type: boolean
      parentID:
        type: string
      size:
        type: integer
      thumbnailURL:
        type: string
      ulid:
        type: string
    type: object
  engine.fullFileSystem:
    properties:
      error:
        type: string
      fileSystem:
        items:
          $ref: '#/definitions/engine.fileTreeStruct'
        type: array
      warnings:
        items:
          type: string
        type: array
    type: object
host: localhost:8000
info:
  contact:
    name: API Support
    url: https://github.com/drummonds/godocs
  description: |-
    Electronic Document Management System API - Backend service for document storage, search, and management
    Supports document ingestion, full-text search, word cloud generation, and file system browsing
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: godocs Backend API
  version: "1.0"
paths:
  /about:
    get:
      consumes:
      - application/json
      description: Retrieve information about the application configuration, version,
        and database
      produces:
      - application/json
      responses:
        "200":
          description: Application information
          schema:
            additionalProperties: true
            type: object
      summary: Get application information
      tags:
      - Admin
  /api/dimensions:
    get:
      consumes:
      - application/json
      description: Retrieve all dimension types and their possible values
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.DimensionWithValues'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all dimensions
      tags:
      - Dimensions
  /api/document/{id}/ocr:
    put:
      consumes:
      - application/json
      description: Set or replace the extracted text for a document. Writes the sidecar
        file and updates search index.
      parameters:
      - description: Document ULID
        in: path
        name: id
        required: true
        type: string
      - description: OCR text
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Text updated
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Document not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set document OCR text
      tags:
      - Documents
  /api/document/{id}/status:
    get:
      consumes:
      - application/json
      description: Get status information including thumbnail, text, and tag availability
      parameters:
      - description: Document ULID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Document status
          schema:
            $ref: '#/definitions/engine.DocumentStatus'
        "404":
          description: Document not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get document status
      tags:
      - Documents
  /api/document/{id}/text:
    get:
      consumes:
      - application/json
      description: Get the extracted full text content of a document
      parameters:
      - description: Document ULID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Document text
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Document not found or no text available
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get document text
      tags:
      - Documents
  /api/document/{id}/thumbnail:
    get:
      description: Get a thumbnail image for a document by its ID
      parameters:
      - description: Document ULID
        in: path
        name: id
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: Thumbnail image
          schema:
            type: file
        "404":
          description: Thumbnail not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get document thumbnail
      tags:
      - Documents
  /api/document/{id}/thumbnail/regenerate:
    post:
      consumes:
      - application/json
      description: Force regeneration of thumbnail for a PDF document
      parameters:
      - description: Document ULID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Thumbnail regenerated
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Document is not a PDF
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Document not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to regenerate thumbnail
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Regenerate document thumbnail
      tags:
      - Documents
  /api/documents/{ulid}/dimensions:
    get:
      consumes:
      - application/json
      description: Get all dimension values assigned to a document
      parameters:
      - description: Document ULID
        in: path
        name: ulid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              $ref: '#/definitions/database.DimensionValue'
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get document dimensions
      tags:
      - Dimensions
    post:
      consumes:
      - application/json
      description: Set or update a dimension value for a document
      parameters:
      - description: Document ULID
        in: path
        name: ulid
        required: true
        type: string
      - description: Dimension assignment
        in: body
        name: dimension
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Set document dimension
      tags:
      - Dimensions
  /api/documents/{ulid}/dimensions/{dimensionName}:
    delete:
      consumes:
      - application/json
      description: Remove a dimension value assignment from a document
      parameters:
      - description: Document ULID
        in: path
        name: ulid
        required: true
        type: string
      - description: Dimension name
        in: path
        name: dimensionName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Remove document dimension
      tags:
      - Dimensions
  /api/documents/{ulid}/tags:
    get:
      consumes:
      - application/json
      description: Get all tags associated with a document
      parameters:
      - description: Document ULID
        in: path
        name: ulid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.Tag'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get document tags
      tags:
      - Tags
    post:
      consumes:
      - application/json
      description: Associate a tag with a document
      parameters:
      - description: Document ULID
        in: path
        name: ulid
        required: true
        type: string
      - description: Tag ID
        in: body
        name: tagId
        required: true
        schema:
          type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Add tag to document
      tags:
      - Tags
  /api/documents/{ulid}/tags/{tagId}:
    delete:
      consumes:
      - application/json
      description: Remove a tag association from a document
      parameters:
      - description: Document ULID
        in: path
        name: ulid
        required: true
        type: string
      - description: Tag ID
        in: path
        name: tagId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Remove tag from document
      tags:
      - Tags
  /api/documents/by-tag/{tagId}:
    get:
      consumes:
      - application/json
      description: Get paginated documents that have a specific tag
      parameters:
      - description: Tag ID
        in: path
        name: tagId
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/engine.SearchResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get documents by tag
      tags:
      - Searches
  /api/documents/untagged:
    get:
      consumes:
      - application/json
      description: Get paginated documents that have no tags (Inbox)
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/engine.SearchResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get untagged documents
      tags:
      - Searches
  /api/log:
    post:
      consumes:
      - application/json
      description: Accept log entries from the frontend and log them using slog with
        proper structure
      parameters:
      - description: Log entry from frontend
        in: body
        name: logEntry
        required: true
        schema:
          $ref: '#/definitions/engine.LogEntry'
      produces:
      - application/json
      responses:
        "200":
          description: Log entry recorded
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid log format
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log from frontend
      tags:
      - Admin
  /api/saved-searches:
    get:
      consumes:
      - application/json
      description: Retrieve all saved searches with their document counts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.SavedSearchWithCount'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all saved searches
      tags:
      - Searches
    post:
      consumes:
      - application/json
      description: Create a new saved search
      parameters:
      - description: Saved search object
        in: body
        name: search
        required: true
        schema:
          $ref: '#/definitions/database.SavedSearch'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/database.SavedSearch'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a saved search
      tags:
      - Searches
  /api/saved-searches/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a saved search by ID
      parameters:
      - description: Search ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete a saved search
      tags:
      - Searches
    get:
      consumes:
      - application/json
      description: Retrieve a saved search by ID
      parameters:
      - description: Search ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.SavedSearch'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get a saved search
      tags:
      - Searches
    put:
      consumes:
      - application/json
      description: Update saved search properties
      parameters:
      - description: Search ID
        in: path
        name: id
        required: true
        type: integer
      - description: Saved search object
        in: body
        name: search
        required: true
        schema:
          $ref: '#/definitions/database.SavedSearch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.SavedSearch'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update a saved search
      tags:
      - Searches
  /api/saved-searches/{id}/execute:
    get:
      consumes:
      - application/json
      description: Execute a saved search and return paginated results
      parameters:
      - description: Search ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/engine.SearchResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Execute a saved search
      tags:
      - Searches
  /api/search/query:
    get:
      consumes:
      - application/json
      description: Execute a search query and return paginated results
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/engine.SearchResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Execute an ad-hoc search
      tags:
      - Searches
  /api/tags:
    get:
      consumes:
      - application/json
      description: Retrieve all tags in the system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.Tag'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all tags
      tags:
      - Tags
    post:
      consumes:
      - application/json
      description: Create a new tag
      parameters:
      - description: Tag object
        in: body
        name: tag
        required: true
        schema:
          $ref: '#/definitions/database.Tag'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/database.Tag'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new tag
      tags:
      - Tags
  /api/tags/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a tag and remove it from all documents
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete a tag
      tags:
      - Tags
    put:
      consumes:
      - application/json
      description: Update tag properties
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: integer
      - description: Tag object
        in: body
        name: tag
        required: true
        schema:
          $ref: '#/definitions/database.Tag'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.Tag'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update a tag
      tags:
      - Tags
  /api/tags/groups:
    get:
      consumes:
      - application/json
      description: Retrieve all distinct tag group names
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get tag groups
      tags:
      - Tags
  /api/tags/usage:
    get:
      consumes:
      - application/json
      description: Retrieve all tags with the number of documents using each tag
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/engine.TagWithUsage'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all tags with usage counts
      tags:
      - Tags
  /clean:
    post:
      consumes:
      - application/json
      description: Remove database entries for missing files and move orphaned files
        to ingress
      produces:
      - application/json
      responses:
        "200":
          description: Job created with jobId
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Clean database
      tags:
      - Admin
  /document:
    delete:
      consumes:
      - application/json
      description: Deletes a document or folder from the system, including database
        entry and physical file
      parameters:
      - description: Document ULID
        in: query
        name: id
        type: string
      - description: File path relative to document root
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Document Deleted" or "Folder Deleted
          schema:
            type: string
        "404":
          description: File not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Delete a file or folder
      tags:
      - Documents
  /document/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve document details by ULID
      parameters:
      - description: Document ULID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Document details
          schema:
            $ref: '#/definitions/database.Document'
        "404":
          description: Document not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get a document by ID
      tags:
      - Documents
  /document/move:
    patch:
      consumes:
      - application/json
      description: Move one or more documents to a different folder in the document
        tree
      parameters:
      - description: Target folder path
        in: query
        name: folder
        required: true
        type: string
      - collectionFormat: csv
        description: Document ULID(s) to move
        in: query
        items:
          type: string
        name: id
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Ok
          schema:
            type: string
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Move documents to a new folder
      tags:
      - Documents
  /document/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload a new document file to the ingress folder for processing
      parameters:
      - description: Upload path (relative to ingress folder)
        in: formData
        name: path
        type: string
      - description: Document file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Path to uploaded file
          schema:
            type: string
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Upload a document
      tags:
      - Documents
  /document/view/{ulid}:
    get:
      description: Serve the actual document file for viewing or download
      parameters:
      - description: Document ULID
        in: path
        name: ulid
        required: true
        type: string
      produces:
      - application/pdf
      - image/png
      - image/jpeg
      - application/octet-stream
      responses:
        "200":
          description: Document file
          schema:
            type: file
        "404":
          description: Document not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: View/download a document file
      tags:
      - Documents
  /documents/filesystem:
    get:
      consumes:
      - application/json
      description: Retrieve the complete document folder structure as a tree
      produces:
      - application/json
      responses:
        "200":
          description: Complete filesystem tree
          schema:
            $ref: '#/definitions/engine.fullFileSystem'
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get document filesystem tree
      tags:
      - Documents
  /documents/latest:
    get:
      consumes:
      - application/json
      description: Retrieve the most recently ingested documents with pagination
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated documents with metadata
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get latest documents
      tags:
      - Documents
  /folder:
    post:
      consumes:
      - application/json
      description: Create a new folder in the document filesystem
      parameters:
      - description: Folder name
        in: query
        name: folder
        required: true
        type: string
      - description: Parent path
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Full folder path created
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new folder
      tags:
      - Folders
  /folder/{folder}:
    get:
      consumes:
      - application/json
      description: Retrieve all documents in a specific folder
      parameters:
      - description: Folder name
        in: path
        name: folder
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of documents in folder
          schema:
            items:
              $ref: '#/definitions/database.Document'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get folder contents
      tags:
      - Folders
  /ingest:
    post:
      consumes:
      - application/json
      description: Manually trigger the document ingestion process to process files
        in the ingress folder
      produces:
      - application/json
      responses:
        "200":
          description: Job created with job ID
          schema:
            additionalProperties: true
            type: object
      summary: Trigger document ingestion
      tags:
      - Admin
  /jobs:
    get:
      consumes:
      - application/json
      description: Retrieve a list of recent jobs with pagination
      parameters:
      - description: 'Number of jobs to return (default: 20)'
        in: query
        name: limit
        type: integer
      - description: 'Offset for pagination (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of jobs
          schema:
            items:
              $ref: '#/definitions/database.Job'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get recent jobs
      tags:
      - Jobs
  /jobs/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve details of a specific job by its ID
      parameters:
      - description: Job ID (ULID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Job details
          schema:
            $ref: '#/definitions/database.Job'
        "400":
          description: Invalid job ID
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Job not found
          schema:
            additionalProperties: true
            type: object
      summary: Get job by ID
      tags:
      - Jobs
  /jobs/active:
    get:
      consumes:
      - application/json
      description: Retrieve all jobs that are currently running or pending
      produces:
      - application/json
      responses:
        "200":
          description: List of active jobs
          schema:
            items:
              $ref: '#/definitions/database.Job'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get active jobs
      tags:
      - Jobs
  /search:
    get:
      consumes:
      - application/json
      description: Search all documents using PostgreSQL full-text search
      parameters:
      - description: Search term
        in: query
        name: term
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Search results
          schema:
            $ref: '#/definitions/engine.fullFileSystem'
        "204":
          description: No results found
        "404":
          description: Empty search term
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Search documents
      tags:
      - Search
  /search/reindex:
    post:
      consumes:
      - application/json
      description: Rebuild the full-text search index for all documents
      produces:
      - application/json
      responses:
        "200":
          description: Reindex successful
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Reindex failed
          schema:
            additionalProperties: true
            type: object
      summary: Reindex search documents
      tags:
      - Search
  /wordcloud:
    get:
      consumes:
      - application/json
      description: Retrieve the top N most frequent words from all documents for word
        cloud visualization
      parameters:
      - description: 'Maximum number of words to return (default: 100, max: 500)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Word cloud data with words, metadata, and count
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get word cloud data
      tags:
      - WordCloud
  /wordcloud/recalculate:
    post:
      consumes:
      - application/json
      description: Trigger a full recalculation of word frequencies from all documents
      produces:
      - application/json
      responses:
        "200":
          description: Recalculation started
          schema:
            additionalProperties: true
            type: object
      summary: Recalculate word cloud
      tags:
      - WordCloud
schemes:
- http
- https
swagger: "2.0"
tags:
- description: Document management operations
  name: Documents
- description: Full-text search and indexing operations
  name: Search
- description: Folder management operations
  name: Folders
- description: Administrative operations (ingestion, cleanup)
  name: Admin
- description: Word frequency analysis and word cloud generation
  name: WordCloud
- description: Service health check
  name: Health
