<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>godocs demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <style>
        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        #loading .progress {
            max-width: 400px;
            margin-top: 1rem;
        }
        #app { display: none; }
        #app.loaded { display: block; }
    </style>
</head>
<body>
    <div id="loading">
        <h1 class="title">godocs demo</h1>
        <p class="subtitle">Loading WebAssembly...</p>
        <progress id="progress" class="progress is-primary" max="100">Loading...</progress>
        <p id="status" class="has-text-grey">Initializing...</p>
    </div>
    <div id="app"></div>

    <script src="wasm_exec.js"></script>
    <script src="app.js"></script>
</body>
</html>
