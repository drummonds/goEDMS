# GoReleaser configuration for godocs
# Test with: goreleaser release --snapshot --clean
# Release with: goreleaser release (requires GITHUB_TOKEN)

version: 2

project_name: godocs

before:
  hooks:
    # WASM is pre-built and committed to git (required for embed directive)
    # Build WASM manually before creating a release: task build:wasm

builds:
  - id: godocs
    main: .
    binary: godocs
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X 'github.com/drummonds/godocs/internal/build.Version={{.Version}}'

archives:
  - id: godocs-archive
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE*
      - CHANGELOG.md
      - .env.example
      - web/*
      - public/**/*

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: drummonds
    name: godocs
  name_template: "v{{.Version}}"
