<div class="column is-half-desktop is-full-tablet">
    <div class="card document-card">
        <div class="card-inner">
            <div class="card-thumbnail">
                {% if doc.HasThumbnail %}
                <figure class="image thumbnail-figure">
                    <img class="thumbnail-img" src="/api/document/{{ doc.ULID }}/thumbnail" alt="{{ doc.Name }}">
                </figure>
                {% else %}
                <div class="thumbnail-placeholder">
                    <span>{{ doc.DocumentType }}</span>
                </div>
                {% endif %}
            </div>
            <div class="card-right-content">
                <div class="buttons are-small mb-2">
                    <a href="/document/{{ doc.ULID }}" class="button is-link is-outlined">View</a>
                    <a href="/document/view/{{ doc.ULID }}" class="button is-info is-outlined">Download</a>
                    <a href="/document/{{ doc.ULID }}/edit" class="button is-warning is-outlined">Edit</a>
                </div>
                <p class="title is-6 mb-2">
                    <a href="/document/{{ doc.ULID }}">{{ doc.Name }}</a>
                </p>
                <p class="subtitle is-7 has-text-grey mb-3">{{ doc.Folder }}</p>
                <div class="tags mb-3">
                    <span class="tag doc-type-badge is-info is-light">{{ doc.DocumentType }}</span>
                    {% for tag in doc.Tags %}
                    <span class="tag tag-chip" style="background-color: {{ tag.Color }}; color: white;">{{ tag.Name }}</span>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
