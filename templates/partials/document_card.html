<div class="column is-one-third-desktop is-half-tablet">
    <div class="card document-card">
        <div class="card-top-row">
            <div class="card-thumbnail">
                <a href="/document/view/{{ doc.ULID }}">
                {% if doc.HasThumbnail %}
                <img class="thumbnail-img" src="/api/document/{{ doc.ULID }}/thumbnail" alt="{{ doc.Name }}">
                {% else %}
                <div class="thumbnail-placeholder">
                    <span>{{ doc.DocumentType }}</span>
                </div>
                {% endif %}
                </a>
            </div>
            <div class="card-sidebar">
                <div class="card-buttons">
                    <a href="/document/{{ doc.ULID }}/edit" class="button is-small is-warning is-outlined" title="Edit">&#9998;</a>
                    <a href="/documents/bulk-edit?ulids={{ doc.ULID }}" class="button is-small is-outlined" title="Select">&#9744;</a>
                    {% if select_mode %}
                    <label class="button is-small is-outlined" title="Select">
                        <input type="checkbox" name="ulids" value="{{ doc.ULID }}">
                    </label>
                    {% endif %}
                </div>
                {% for tag in doc.Tags %}
                <span class="tag tag-chip" style="background-color: {{ tag.Color }}; color: white;" title="{{ tag.Name }}">{{ tag.Name }}</span>
                {% endfor %}
            </div>
        </div>
        <div class="card-bottom-content">
            <a href="/document/view/{{ doc.ULID }}" class="is-size-6">{{ doc.Name }}</a>
            <span class="tag doc-type-badge is-info is-light ml-2">{{ doc.DocumentType }}</span>
        </div>
    </div>
</div>
