<div class="column is-one-third-desktop is-half-tablet">
    <div class="card document-card">
        <div class="card-thumbnail">
            {% if doc.HasThumbnail %}
            <img class="thumbnail-img" src="/api/document/{{ doc.ULID }}/thumbnail" alt="{{ doc.Name }}">
            {% else %}
            <div class="thumbnail-placeholder">
                <span>{{ doc.DocumentType }}</span>
            </div>
            {% endif %}
        </div>
        <div class="card-actions">
            <a href="/document/{{ doc.ULID }}" class="button is-small is-link is-outlined" title="View document">&#128065;</a>
            <a href="/document/view/{{ doc.ULID }}" class="button is-small is-info is-outlined" title="Download file">&#11015;</a>
            <a href="/document/{{ doc.ULID }}/edit" class="button is-small is-warning is-outlined" title="Edit tags">&#9998;</a>
            {% for tag in doc.Tags %}
            <span class="tag tag-chip" style="background-color: {{ tag.Color }}; color: white;" title="{{ tag.Name }}">{{ tag.Name }}</span>
            {% endfor %}
        </div>
        <div class="card-bottom-content">
            <p class="title is-6 mb-1">
                <a href="/document/{{ doc.ULID }}">{{ doc.Name }}</a>
            </p>
            <div class="is-flex is-align-items-center is-flex-wrap-wrap" style="gap: 0.25rem;">
                <span class="is-size-7 has-text-grey">{{ doc.Folder }}</span>
                <span class="tag doc-type-badge is-info is-light">{{ doc.DocumentType }}</span>
            </div>
        </div>
    </div>
</div>
