name: Deploy WASM Demo to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build WASM binary
        run: |
          mkdir -p gh-pages/demo
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o gh-pages/demo/godocs-demo.wasm .
          cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" gh-pages/demo/

      - name: Copy API docs
        run: |
          cp docs/index.html gh-pages/api.html
          cp docs/swagger.json gh-pages/swagger.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
